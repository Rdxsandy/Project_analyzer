spring.application.name=upload-service
server.port=8086

# Downstream services
analyzer.service.url=http://localhost:8083
scan.service.url=http://localhost:8082

# Max upload size – 100 MB to support large project folders
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB

# Temporary directory for extracted uploads (OS temp by default)
upload.temp.dir=${java.io.tmpdir}/codeguardian-uploads

# Prevent ERR_CONNECTION_RESET by allowing Tomcat to swallow large bodies during rejection/processing
server.tomcat.max-swallow-size=-1
server.tomcat.max-parameter-count=100000
